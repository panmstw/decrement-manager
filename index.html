<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>多項目週期遞減器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(145deg, #0b1120 0%, #182634 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
            padding: 1rem;
            min-height: 100vh;
        }
        .app-container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 1.8rem; background: linear-gradient(135deg,#FFF,#9ac8ff); background-clip: text; color: transparent; }
        .header p { color: #8aaec0; font-size: 0.8rem; }
        .add-card {
            background: rgba(20,28,38,0.7);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .add-field { flex: 1; min-width: 120px; }
        .add-field input, .add-field select {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2rem;
            padding: 0.6rem 0.8rem;
            color: white;
            font-size: 0.85rem;
        }
        .create-btn {
            background: #2c4b6e;
            border: none;
            border-radius: 2rem;
            padding: 0 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .items-grid { display: flex; flex-direction: column; gap: 1rem; }
        .item-card {
            background: rgba(18,26,36,0.8);
            backdrop-filter: blur(16px);
            border-radius: 1.8rem;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1rem;
        }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .item-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg,#fff,#b9e0ff); background-clip: text; color: transparent; }
        .icon-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            color: white;
        }
        .period-badge { display: inline-block; background: rgba(0,0,0,0.5); padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.7rem; color: #c3e2fc; margin-bottom: 0.8rem; }
        .number-area { text-align: center; margin: 0.5rem 0; }
        .big-number { font-size: 3rem; font-weight: 800; background: linear-gradient(145deg,#fff,#b3dfee); background-clip: text; color: transparent; }
        .countdown-sm { font-size: 0.75rem; color: #aac2d9; }
        .progress-sm { margin: 0.5rem 0; }
        .progress-bar-bg-sm { background: rgba(0,0,0,0.5); border-radius: 20px; height: 4px; }
        .progress-fill-sm { width: 0%; height: 4px; background: linear-gradient(90deg,#4fc3f7,#9f7aea); border-radius: 20px; }
        .settings-area { background: rgba(0,0,0,0.3); border-radius: 1.2rem; padding: 0.6rem; margin-top: 0.6rem; }
        .flex-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.6rem; }
        .flex-row label { font-size: 0.7rem; color: #9bb7d0; width: 55px; }
        .custom-input-sm { flex: 2; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 1.5rem; padding: 0.4rem 0.6rem; color: white; font-size: 0.8rem; }
        .period-select-sm { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 1.5rem; padding: 0.4rem; color: white; }
        .action-btn-sm { background: #2c4b6e; border: none; border-radius: 1.5rem; padding: 0.4rem 0.9rem; color: white; font-size: 0.7rem; cursor: pointer; }
        .delete-item { background: rgba(200,70,80,0.3); border: none; border-radius: 2rem; width: 100%; padding: 0.5rem; margin-top: 0.6rem; color: #ffb5b0; font-size: 0.7rem; cursor: pointer; }
        .footer-status { text-align: center; font-size: 0.7rem; color: #6c8eaa; margin-top: 1.5rem; }
        button:active { transform: scale(0.96); }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>📋 週期遞減管理器</h1>
        <p>自訂標題・獨立週期・自動記憶</p>
    </div>
    <div class="add-card">
        <div class="add-field"><input type="text" id="newItemName" placeholder="名稱" value="新項目"></div>
        <div class="add-field"><input type="number" id="newItemValue" value="100"></div>
        <div class="add-field">
            <select id="newItemPeriod">
                <option value="day">每日</option><option value="month">每月</option><option value="year">每年</option>
            </select>
        </div>
        <button class="create-btn" id="createItemBtn">＋ 新增</button>
    </div>
    <div id="itemsGrid" class="items-grid"></div>
    <div class="footer-status">💾 自動儲存 | 每個週期結束自動減1</div>
</div>
<script>
    let items = [];
    function getPeriodStart(period, ref = new Date()) {
        let d = new Date(ref);
        if (period === 'day') return new Date(d.getFullYear(), d.getMonth(), d.getDate());
        if (period === 'month') return new Date(d.getFullYear(), d.getMonth(), 1);
        return new Date(d.getFullYear(), 0, 1);
    }
    function getPeriodEnd(period, start) {
        if (period === 'day') return new Date(start.getTime() + 86400000);
        if (period === 'month') return new Date(start.getFullYear(), start.getMonth() + 1, 1);
        return new Date(start.getFullYear() + 1, 0, 1);
    }
    function getPeriodProgress(period, now) {
        let start = getPeriodStart(period, now);
        let end = getPeriodEnd(period, start);
        let total = end - start, elapsed = now - start;
        return { totalMs: total, elapsedMs: elapsed, remainingMs: Math.max(0, end - now) };
    }
    function formatRemaining(period, ms) {
        let sec = Math.floor(ms / 1000), days = Math.floor(sec / 86400), hours = Math.floor((sec % 86400) / 3600), mins = Math.floor((sec % 3600) / 60);
        if (period === 'day') return `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(sec % 60).padStart(2,'0')}`;
        if (period === 'month') return days > 0 ? `${days}天 ${hours}時` : `${hours}時 ${mins}分`;
        return days > 0 ? `${days}天 ${hours}時` : `${hours}時 ${mins}分`;
    }
    function checkDecrement(item) {
        let now = new Date();
        let curStart = getPeriodStart(item.period, now);
        let last = item.lastAnchor ? new Date(item.lastAnchor) : null;
        if (!last) { item.lastAnchor = curStart.toISOString(); return false; }
        if (curStart.getTime() > last.getTime() && item.currentValue > 0) {
            item.currentValue = Math.max(0, item.currentValue - 1);
            item.lastAnchor = curStart.toISOString();
            return true;
        }
        return false;
    }
    function repairMissed(item) {
        let now = new Date();
        let anchor = item.lastAnchor ? new Date(item.lastAnchor) : null;
        if (!anchor) { item.lastAnchor = getPeriodStart(item.period, now).toISOString(); return; }
        let cycles = 0, cur = new Date(anchor);
        while (cycles < 500) {
            let next = item.period === 'day' ? new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1) :
                      (item.period === 'month' ? new Date(cur.getFullYear(), cur.getMonth() + 1, 1) :
                      new Date(cur.getFullYear() + 1, 0, 1));
            if (next <= now) { cycles++; cur = next; } else break;
        }
        if (cycles > 0 && item.currentValue > 0) {
            item.currentValue = Math.max(0, item.currentValue - Math.min(cycles, item.currentValue));
            let newAnchor = item.period === 'day' ? new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()) :
                            (item.period === 'month' ? new Date(cur.getFullYear(), cur.getMonth(), 1) :
                            new Date(cur.getFullYear(), 0, 1));
            item.lastAnchor = newAnchor.toISOString();
        } else if (cycles > 0 && item.currentValue === 0) {
            let newAnchor = item.period === 'day' ? new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()) :
                            (item.period === 'month' ? new Date(cur.getFullYear(), cur.getMonth(), 1) :
                            new Date(cur.getFullYear(), 0, 1));
            item.lastAnchor = newAnchor.toISOString();
        }
    }
    function save() { localStorage.setItem('decrement_items', JSON.stringify(items)); }
    function load() {
        let raw = localStorage.getItem('decrement_items');
        if (raw) { try { items = JSON.parse(raw); } catch(e){} }
        if (!items.length) items = [
            { id: '1', title: '📁 專案倒數', currentValue: 30, initialValue: 30, period: 'day', lastAnchor: getPeriodStart('day', new Date()).toISOString() },
            { id: '2', title: '🎯 年度目標', currentValue: 8, initialValue: 8, period: 'month', lastAnchor: getPeriodStart('month', new Date()).toISOString() }
        ];
        items.forEach(i => repairMissed(i));
        save();
    }
    function render() {
        let grid = document.getElementById('itemsGrid');
        if (!items.length) { grid.innerHTML = '<div style="text-align:center;padding:2rem;">✨ 點擊「新增」建立項目 ✨</div>'; return; }
        let now = new Date();
        grid.innerHTML = items.map(item => {
            let prog = getPeriodProgress(item.period, now);
            let remainText = formatRemaining(item.period, prog.remainingMs);
            let periodPercent = prog.totalMs > 0 ? (prog.elapsedMs / prog.totalMs) * 100 : 0;
            let valuePercent = item.initialValue > 0 ? (item.currentValue / item.initialValue) * 100 : 0;
            return `<div class="item-card">
                <div class="item-header"><span class="item-title">${escapeHtml(item.title)}</span>
                <div><button class="icon-btn" onclick="editTitle('${item.id}')">✎</button>
                <button class="icon-btn" onclick="delItem('${item.id}')">🗑</button></div></div>
                <div class="period-badge">📅 ${item.period === 'day' ? '每日' : item.period === 'month' ? '每月' : '每年'}遞減</div>
                <div class="number-area"><div class="big-number">${item.currentValue}</div>
                <div class="countdown-sm">🕒 剩餘 ${remainText}</div></div>
                <div class="progress-sm"><div class="progress-bar-bg-sm"><div class="progress-fill-sm" style="width: ${Math.min(100,periodPercent)}%;"></div></div>
                <div style="display:flex;justify-content:space-between;font-size:0.6rem;"><span>週期進度 ${Math.floor(periodPercent)}%</span><span>數值剩餘 ${Math.floor(valuePercent)}%</span></div></div>
                <div class="settings-area">
                    <div class="flex-row"><label>🎯 當前值</label><input type="number" id="val_${item.id}" class="custom-input-sm" value="${item.currentValue}"><button class="action-btn-sm" onclick="setValue('${item.id}')">設定</button></div>
                    <div class="flex-row"><label>📌 初始值</label><input type="number" id="init_${item.id}" class="custom-input-sm" value="${item.initialValue}"><button class="action-btn-sm" onclick="setInit('${item.id}')">重置至此</button></div>
                    <div class="flex-row"><label>⏱️ 週期</label><select id="period_${item.id}" class="period-select-sm"><option value="day" ${item.period==='day'?'selected':''}>每日</option><option value="month" ${item.period==='month'?'selected':''}>每月</option><option value="year" ${item.period==='year'?'selected':''}>每年</option></select><button class="action-btn-sm" onclick="changePeriod('${item.id}')">套用</button>
                    <button class="action-btn-sm" onclick="resetVal('${item.id}')">↺ 重置數值</button></div>
                </div>
                <button class="delete-item" onclick="delItem('${item.id}')">刪除此項目</button>
            </div>`;
        }).join('');
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, function(c){ if(c==='&')return '&amp;'; if(c==='<')return '&lt;'; return '&gt;'; }); }
    window.editTitle = function(id) {
        let item = items.find(i => i.id === id);
        if (item) { let newTitle = prompt('新標題', item.title); if (newTitle) { item.title = newTitle; save(); render(); } }
    };
    window.delItem = function(id) { items = items.filter(i => i.id !== id); save(); render(); };
    window.setValue = function(id) {
        let input = document.getElementById(`val_${id}`);
        if (input) { let v = parseInt(input.value); if (!isNaN(v)) { let item = items.find(i=>i.id===id); if(item){ item.currentValue = Math.max(0,v); save(); render(); } } }
    };
    window.setInit = function(id) {
        let input = document.getElementById(`init_${id}`);
        if (input) { let v = parseInt(input.value); if (!isNaN(v)) { let item = items.find(i=>i.id===id); if(item){ item.initialValue = v; item.currentValue = v; let now = new Date(); item.lastAnchor = getPeriodStart(item.period, now).toISOString(); save(); render(); } } }
    };
    window.changePeriod = function(id) {
        let sel = document.getElementById(`period_${id}`);
        if (sel) { let item = items.find(i=>i.id===id); if(item){ item.period = sel.value; let now = new Date(); item.lastAnchor = getPeriodStart(item.period, now).toISOString(); save(); render(); } }
    };
    window.resetVal = function(id) {
        let item = items.find(i=>i.id===id);
        if(item){ item.currentValue = item.initialValue; let now = new Date(); item.lastAnchor = getPeriodStart(item.period, now).toISOString(); save(); render(); }
    };
    function addItem(name, initVal, period) {
        let now = new Date();
        items.push({ id: Date.now()+''+Math.random(), title: name, currentValue: initVal, initialValue: initVal, period: period, lastAnchor: getPeriodStart(period, now).toISOString() });
        save(); render();
    }
    document.getElementById('createItemBtn').addEventListener('click', ()=>{
        let name = document.getElementById('newItemName').value.trim() || '項目';
        let val = parseInt(document.getElementById('newItemValue').value) || 0;
        let period = document.getElementById('newItemPeriod').value;
        addItem(name, val, period);
        document.getElementById('newItemName').value = '';
        document.getElementById('newItemValue').value = '100';
    });
    function tick() {
        let changed = false;
        for (let i of items) if (checkDecrement(i)) changed = true;
        if (changed) { save(); render(); } else render();
    }
    load(); render(); setInterval(tick, 1000);
</script>
</body>
</html>
